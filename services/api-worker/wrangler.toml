# Cloudflare Worker — Autoprime PDI API
# DO NOT put secrets here. Use: wrangler secret put <KEY>

name = "autoprime-pdi-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Development environment
[env.development]
name = "autoprime-pdi-api-dev"
vars = { ENVIRONMENT = "development", LOG_LEVEL = "debug" }

# Staging environment
[env.staging]
name = "autoprime-pdi-api-staging"
vars = { ENVIRONMENT = "staging", LOG_LEVEL = "info" }

# Production environment
[env.production]
name = "autoprime-pdi-api-prod"
vars = { ENVIRONMENT = "production", LOG_LEVEL = "warn" }

# Secrets (configured via: wrangler secret put <KEY> --env <ENV>)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_JWT_SECRET
# R2_ACCOUNT_ID
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY
# NOTIFICATION_API_KEY
# APP_SIGNING_SECRET

# R2 bucket bindings
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "autoprime-pdi-dev"
preview_bucket_name = "autoprime-pdi-dev"

[env.staging.r2_buckets]
binding = "MEDIA_BUCKET"
bucket_name = "autoprime-pdi-staging"

[env.production.r2_buckets]
binding = "MEDIA_BUCKET"
bucket_name = "autoprime-pdi-prod"

# Rate limiting
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1"
simple = { limit = 100, period = 60 }
