name: Database Check

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed/**'

jobs:
  migration-check:
    name: Validate Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Run migrations
        run: supabase db reset

      - name: Validate schema
        run: supabase db lint

      - name: Stop Supabase
        run: supabase stop
        if: always()
